<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent - Ciberespacio Security</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #c62828;
            --primary-dark: #8e0000;
            --secondary: #1a1a1a;
            --accent: #f5f5f5;
            --text: #e0e0e0;
            --dark: #0d0d0d;
            --card: #1e1e1e;
        }

        body {
            background: linear-gradient(135deg, var(--dark) 0%, var(--secondary) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(198, 40, 40, 0.1), transparent);
            transform: rotate(45deg);
            animation: animateGrid 8s linear infinite;
        }

        @keyframes animateGrid {
            0% {
                transform: rotate(45deg) translate(-10%, -10%);
            }
            100% {
                transform: rotate(45deg) translate(10%, 10%);
            }
        }

        .success-container {
            background: rgba(30, 30, 30, 0.95);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 2px solid var(--primary);
            position: relative;
            z-index: 1;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: scaleIn 0.6s ease-out 0.2s both;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .success-icon i {
            font-size: 50px;
            color: white;
            animation: checkmark 0.8s ease-out 0.4s both;
        }

        @keyframes checkmark {
            0% {
                opacity: 0;
                transform: scale(0) rotate(-45deg);
            }
            50% {
                transform: scale(1.2) rotate(0deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: var(--accent);
            animation: fadeIn 0.8s ease-out 0.6s both;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #aaa;
            line-height: 1.6;
            animation: fadeIn 0.8s ease-out 0.8s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .redirect-message {
            margin-top: 30px;
            padding: 20px;
            background: rgba(198, 40, 40, 0.1);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            animation: fadeIn 1s ease-out 1s both;
        }

        .redirect-message i {
            color: var(--primary);
            margin-right: 10px;
        }

        .countdown {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        .logo i {
            font-size: 2rem;
            color: var(--primary);
            margin-right: 10px;
        }

        .logo h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            animation: progressFill 3s linear forwards;
        }

        @keyframes progressFill {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="logo">
            <i class="fas fa-shield-alt"></i>
            <h2>CIBERES<span>PACIO</span></h2>
        </div>

        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>

        <h1>Message Sent Successfully!</h1>

        <p>Thank you for contacting Ciberespacio Security.</p>
        <p>Our team has received your message and will respond within 24 hours.</p>

        <div class="redirect-message">
            <i class="fas fa-info-circle"></i>
            <span>Redirecting you back in <span class="countdown" id="countdown">3</span> seconds...</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <script>
        let countdown = 3;
        const countdownElement = document.getElementById('countdown');

        const interval = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;

            if (countdown <= 0) {
                clearInterval(interval);
                window.location.href = '/';
            }
        }, 1000);
    </script>
</body>
</html>
